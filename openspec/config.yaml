schema: spec-driven

# Project context (optional)
# This is shown to AI when creating artifacts.
# Add your tech stack, conventions, style guides, domain knowledge, etc.
# Example:
#   context: |
#     Tech stack: TypeScript, React, Node.js
#     We use conventional commits
#     Domain: e-commerce platform

# Per-artifact rules (optional)
# Add custom rules for specific artifacts.
# Example:
#   rules:
#     proposal:
#       - Keep proposals under 500 words
#       - Always include a "Non-goals" section
#     tasks:
#       - Break tasks into chunks of max 2 hours

# Per-operation guidance (optional)
# Add advisory guidance for how apply and archive work should be conducted.
# This is separate from artifact rules above.
# Example:
#   operations:
#     apply:
#       guidance:
#         - Keep test summaries concise
#     archive:
#       guidance:
#         - Summarize the archive outcome before finishing

rules:
  tasks:
    - "End the last group with one task that runs the project's own test commands for the whole change and completes any fixes the failures need. Do not add test-run tasks to earlier groups. Give it a Verify line that names the test commands."

operations:
  apply:
    guidance:
      # jois-init:opsx begin (managed by /jois-init:opsx; edits here are overwritten)
      - "At the end of each concern, commit it as the apply clause of the jois-git-commit-hygiene rule says. Push only when the user types the confirmation word."
      # jois-init:opsx end
  archive:
    guidance:
      # jois-init:opsx begin (managed by /jois-init:opsx; edits here are overwritten)
      - "Follow the jois-git-commit-hygiene rule for the archive commit: stage by explicit path, show the summary and message, name a confirmation word, and end the turn. Never commit in the turn you stage."
      # jois-init:opsx end
      # jois-init:docs begin (managed by /jois-init:docs; edits here are overwritten)
      - "Before archiving, update the page in wiki/ that the change affects, so the docs match the new behavior. Then run python scripts/check_docs.py."
      # jois-init:docs end
